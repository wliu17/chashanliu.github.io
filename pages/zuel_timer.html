<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EXAM TIME REMAINING - ZUEL</title>
<style>
  /* No external font imports — Google Fonts is often slow/unreachable on
     mainland China networks. Everything below uses system-installed fonts
     only, styled to read as a clean digital display. */
  :root {
    --bg: #0a0e14;
    --panel: #10151f;
    --text-dim: #5a6472;
    --green: #34d058;
    --yellow-green: #a3d834;
    --yellow: #f0d000;
    --orange: #ff8c1a;
    --red: #ff3b3b;
    --current: var(--green);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    overflow: hidden;
  }

  body {
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif;
    color: #e6e9ef;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 2vh 2vw;
    text-align: center;
    user-select: none;
  }

  .title {
    font-family: "Consolas", "Segoe UI", "Microsoft YaHei", monospace;
    font-weight: 700;
    font-size: clamp(1.1rem, 2.6vw, 2.4rem);
    letter-spacing: 0.12em;
    color: #cfd6e0;
    text-transform: uppercase;
  }

  .date {
    margin-top: 0.6vh;
    font-size: clamp(0.75rem, 1vw, 1rem);
    letter-spacing: 0.08em;
    color: var(--text-dim);
    font-weight: 400;
  }

  .timer-wrap {
    margin: 3vh 0 2vh 0;
    line-height: 1;
  }

  .timer {
    font-family: "Consolas", "DejaVu Sans Mono", "Courier New", monospace;
    font-weight: 900;
    font-size: 22vw;
    line-height: 1;
    letter-spacing: 0.02em;
    color: var(--current);
    text-shadow: 0 0 2.5vw currentColor;
    transition: color 0.6s ease, text-shadow 0.6s ease;
    font-variant-numeric: tabular-nums;
  }

  .status {
    font-size: clamp(0.9rem, 1.6vw, 1.6rem);
    color: var(--text-dim);
    letter-spacing: 0.06em;
    margin-bottom: 3vh;
    min-height: 1.5em;
    transition: color 0.4s ease;
  }

  .status.active {
    color: var(--current);
    transition: color 0.6s ease;
  }

  .controls {
    display: flex;
    gap: 1.6vw;
    flex-wrap: wrap;
    justify-content: center;
  }

  button {
    font-family: "Consolas", "Segoe UI", "Microsoft YaHei", monospace;
    font-weight: 700;
    font-size: clamp(0.85rem, 1.3vw, 1.3rem);
    letter-spacing: 0.1em;
    padding: 1.2vh 2.4vw;
    border-radius: 0.6vw;
    border: 2px solid #2a3341;
    background: var(--panel);
    color: #c9d1de;
    cursor: pointer;
    transition: all 0.15s ease;
    min-width: 8vw;
  }

  button:hover {
    border-color: var(--current);
    color: var(--current);
    box-shadow: 0 0 1.2vw color-mix(in srgb, var(--current) 40%, transparent);
  }

  button:active {
    transform: scale(0.96);
  }

  #startBtn { border-color: #2a4a33; }
  #pauseBtn { border-color: #4a3f2a; }
  #resetBtn { border-color: #4a2a2a; }

  .hint {
    margin-top: 3.5vh;
    font-size: clamp(0.65rem, 0.85vw, 0.85rem);
    color: #3a4250;
    letter-spacing: 0.05em;
  }

  @media (max-width: 700px) {
    .timer { font-size: 24vw; }
    .controls { gap: 3vw; }
    button { min-width: 26vw; padding: 1.6vh 4vw; }
  }
</style>
</head>
<body>

  <div class="title">EXAM TIME REMAINING - ZUEL</div>
  <div class="date" id="dateDisplay"></div>

  <div class="timer-wrap">
    <div class="timer" id="timerDisplay">120:00</div>
  </div>

  <div class="status" id="statusText">Ready for 2-hour exam</div>

  <div class="controls">
    <button id="startBtn">START</button>
    <button id="pauseBtn">PAUSE</button>
    <button id="resetBtn">RESET</button>
  </div>

  <div class="hint">SPACE = start / pause &nbsp;&nbsp;|&nbsp;&nbsp; R = reset</div>

<script>
  const TOTAL_SECONDS = 120 * 60;
  let remaining = TOTAL_SECONDS;
  let timerId = null;
  let running = false;

  const timerDisplay = document.getElementById('timerDisplay');
  const statusText = document.getElementById('statusText');
  const dateDisplay = document.getElementById('dateDisplay');
  const startBtn = document.getElementById('startBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  const resetBtn = document.getElementById('resetBtn');
  const root = document.documentElement;

  function formatDate() {
    const now = new Date();
    const y = now.getFullYear();
    const m = String(now.getMonth() + 1).padStart(2, '0');
    const d = String(now.getDate()).padStart(2, '0');
    return `${y}年${m}月${d}日`;
  }
  dateDisplay.textContent = formatDate();

  function formatTime(s) {
    const mm = String(Math.floor(s / 60)).padStart(2, '0');
    const ss = String(s % 60).padStart(2, '0');
    return `${mm}:${ss}`;
  }

  function colorForRemaining(s) {
    const minutes = s / 60;
    if (minutes > 90) return getComputedStyle(root).getPropertyValue('--green').trim();
    if (minutes > 60) return getComputedStyle(root).getPropertyValue('--yellow-green').trim();
    if (minutes > 30) return getComputedStyle(root).getPropertyValue('--yellow').trim();
    if (minutes > 15) return getComputedStyle(root).getPropertyValue('--orange').trim();
    return getComputedStyle(root).getPropertyValue('--red').trim();
  }

  function updateDisplay() {
    timerDisplay.textContent = formatTime(remaining);
    root.style.setProperty('--current', colorForRemaining(remaining));
  }

  function updateStatus() {
    if (remaining === 0) {
      statusText.textContent = "TIME'S UP — PLEASE STOP WRITING";
      statusText.classList.add('active');
      return;
    }
    if (running) {
      statusText.textContent = 'Exam in progress...';
      statusText.classList.add('active');
    } else if (remaining === TOTAL_SECONDS) {
      statusText.textContent = 'Ready for 2-hour exam';
      statusText.classList.remove('active');
    } else {
      statusText.textContent = 'Paused';
      statusText.classList.remove('active');
    }
  }

  function tick() {
    if (remaining > 0) {
      remaining--;
      updateDisplay();
      updateStatus();
      if (remaining === 0) {
        stopTimer();
      }
    }
  }

  function startTimer() {
    if (running || remaining === 0) return;
    running = true;
    timerId = setInterval(tick, 1000);
    updateStatus();
  }

  function pauseTimer() {
    if (!running) return;
    running = false;
    clearInterval(timerId);
    updateStatus();
  }

  function stopTimer() {
    running = false;
    clearInterval(timerId);
  }

  function resetTimer() {
    stopTimer();
    remaining = TOTAL_SECONDS;
    updateDisplay();
    updateStatus();
  }

  startBtn.addEventListener('click', startTimer);
  pauseBtn.addEventListener('click', pauseTimer);
  resetBtn.addEventListener('click', resetTimer);

  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
      e.preventDefault();
      running ? pauseTimer() : startTimer();
    } else if (e.key === 'r' || e.key === 'R') {
      e.preventDefault();
      resetTimer();
    }
  });

  updateDisplay();
  updateStatus();
</script>
</body>
</html>
