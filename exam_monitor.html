<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>考场监考信息显示系统</title>
    <style>
        :root {
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-secondary: #666666;
            --accent-blue: #007bff;
            --warning-orange: #ff8c00;
            --danger-red: #dc3545;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* 全屏时的背景色处理 */
        :fullscreen body {
            background-color: var(--bg-color);
        }

        .container {
            width: 90%;
            max-width: 1000px;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 20px;
            box-shadow: var(--shadow);
            text-align: center;
            position: relative;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 40px;
            border-bottom: 2px solid #eee;
            padding-bottom: 30px;
        }

        .info-item {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .label {
            font-size: 1.2rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .value {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--text-main);
        }

        .input-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        #classId {
            width: 120px;
            font-size: 1.8rem;
            font-weight: bold;
            text-align: center;
            border: 2px solid #ddd;
            border-radius: 8px;
            padding: 5px;
            outline: none;
            transition: border-color 0.3s;
        }

        #classId:focus {
            border-color: var(--accent-blue);
        }

        #classId:disabled {
            background-color: #f8f9fa;
            border-color: #eee;
            color: #999;
            cursor: not-allowed;
        }

        .timer-display {
            font-family: 'Courier New', Courier, monospace;
            font-size: 12rem;
            font-weight: bold;
            margin: 40px 0;
            transition: color 0.3s, text-shadow 0.3s;
        }

        .timer-normal {
            color: var(--text-main);
        }

        .timer-warning {
            color: var(--warning-orange);
            text-shadow: 0 0 20px rgba(255, 140, 0, 0.4);
        }

        .timer-ended {
            color: var(--danger-red);
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 25px;
            font-size: 1.1rem;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s, background-color 0.2s;
            color: white;
        }

        button:active {
            transform: scale(0.95);
        }

        #startBtn {
            background-color: #28a745;
        }

        #pauseBtn {
            background-color: #ffc107;
            color: #333;
        }

        #resetBtn {
            background-color: #6c757d;
        }

        #fullscreenBtn {
            background-color: #17a2b8;
        }

        .shortcuts-hint {
            margin-top: 30px;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        kbd {
            background-color: #eee;
            border-radius: 3px;
            border: 1px solid #ccc;
            padding: 2px 6px;
            font-family: sans-serif;
            margin: 0 2px;
        }
    </style>
</head>
<body>

<div class="container" id="mainContainer">
    <div class="info-grid">
        <div class="info-item">
            <span class="label">课程编号</span>
            <span class="value">B1100030</span>
        </div>
        <div class="info-item">
            <span class="label">考试科目</span>
            <span class="value">大学英语（2）</span>
        </div>
        <div class="info-item">
            <span class="label">听力频率</span>
            <span class="value">FM 84.7 兆赫</span>
        </div>
    </div>

    <div class="input-group">
        <span class="label">课序号/课堂号</span>
        <input type="text" id="classId" maxlength="4" value="0000" placeholder="0000">
    </div>

    <div id="timer" class="timer-display timer-normal">120:00</div>

    <div class="controls">
        <button id="startBtn">开始/继续</button>
        <button id="pauseBtn">暂停</button>
        <button id="resetBtn">重置</button>
        <button id="fullscreenBtn">进入全屏</button>
    </div>

    <div class="shortcuts-hint">
        快捷键：<kbd>空格键</kbd> 开始/暂停 &nbsp;&nbsp; <kbd>R</kbd> 重置 &nbsp;&nbsp; <kbd>F</kbd> 切换全屏
    </div>
</div>

<script>
    let timeLeft = 120 * 60; // 120 minutes in seconds
    let timerId = null;
    let isRunning = false;

    const timerDisplay = document.getElementById('timer');
    const classIdInput = document.getElementById('classId');
    const startBtn = document.getElementById('startBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const resetBtn = document.getElementById('resetBtn');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const mainContainer = document.getElementById('mainContainer');

    function updateDisplay() {
        const minutes = Math.floor(timeLeft / 60);
        const seconds = timeLeft % 60;
        const displayStr = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        timerDisplay.textContent = displayStr;

        // 样式切换
        if (timeLeft === 0) {
            timerDisplay.className = 'timer-display timer-ended';
        } else if (timeLeft <= 15 * 60) {
            timerDisplay.className = 'timer-display timer-warning';
        } else {
            timerDisplay.className = 'timer-display timer-normal';
        }
    }

    function startTimer() {
        if (isRunning || timeLeft <= 0) return;
        
        isRunning = true;
        classIdInput.disabled = true;
        
        timerId = setInterval(() => {
            timeLeft--;
            updateDisplay();
            
            if (timeLeft <= 0) {
                clearInterval(timerId);
                isRunning = false;
            }
        }, 1000);
    }

    function pauseTimer() {
        if (!isRunning) return;
        clearInterval(timerId);
        isRunning = false;
    }

    function toggleTimer() {
        if (isRunning) {
            pauseTimer();
        } else {
            startTimer();
        }
    }

    function resetTimer() {
        pauseTimer();
        timeLeft = 120 * 60;
        classIdInput.disabled = false;
        updateDisplay();
    }

    function toggleFullscreen() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(err => {
                alert(`无法进入全屏模式: ${err.message}`);
            });
        } else {
            if (document.exitFullscreen) {
                document.exitFullscreen();
            }
        }
    }

    // 监听全屏状态变化以更新按钮文字
    document.addEventListener('fullscreenchange', () => {
        if (document.fullscreenElement) {
            fullscreenBtn.textContent = '退出全屏';
        } else {
            fullscreenBtn.textContent = '进入全屏';
        }
    });

    // 输入框限制：仅限数字
    classIdInput.addEventListener('input', (e) => {
        e.target.value = e.target.value.replace(/[^\d]/g, '');
    });

    // 按钮事件
    startBtn.addEventListener('click', startTimer);
    pauseBtn.addEventListener('click', pauseTimer);
    resetBtn.addEventListener('click', resetTimer);
    fullscreenBtn.addEventListener('click', toggleFullscreen);

    // 快捷键支持
    document.addEventListener('keydown', (e) => {
        // 如果焦点在输入框，不触发快捷键
        if (document.activeElement === classIdInput) return;

        const key = e.key.toLowerCase();
        if (e.code === 'Space') {
            e.preventDefault(); // 防止空格滚动页面
            toggleTimer();
        } else if (key === 'r') {
            resetTimer();
        } else if (key === 'f') {
            toggleFullscreen();
        }
    });

    // 初始化显示
    updateDisplay();
</script>

</body>
</html>
