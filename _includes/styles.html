<style>

}

}

/* ── CARD GRID ── */
.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 1.5rem;
}
.card {
  background: #fff;
  border: 1px solid rgba(15,110,86,0.12);
  border-radius: 10px;
  padding: 1.6rem 1.5rem;
  transition: transform 0.25s, box-shadow 0.25s;
  position: relative;
  overflow: hidden;
  text-decoration: none;
  color: inherit;
  display: block;
}
.card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--green-bright), var(--green-mid));
  transform: scaleX(0);
  transform-origin: left;
  transition: transform 0.3s;
}
.card:hover { transform: translateY(-4px); box-shadow: 0 12px 32px rgba(8,80,65,0.1); color: inherit; }
.card:hover::before { transform: scaleX(1); }
.card-icon { font-size: 1.8rem; margin-bottom: 0.8rem; display: block; }
.card h3 {
  font-family: 'ZCOOL XiaoWei', serif;
  font-size: 1.15rem;
  font-weight: 400;
  color: var(--green-dark);
  margin-bottom: 0.5rem;
  letter-spacing: 0.05em;
}
.card p { font-size: 0.88rem; color: var(--ink-muted); line-height: 1.75; }

  letter-spacing: 0.2em;
}
.about-strip h2 {

}
.about-strip p {

}
.about-disclaimer {
  font-size: 0.82rem !important;
  opacity: 0.5 !important;
  margin-top: 1rem !important;
}

footer a:hover { opacity: 1; }
.footer-disclaimer { margin-top: 0.6rem; font-size: 0.72rem; opacity: 0.45; letter-spacing: 0.05em; }

/* ── ANIMATIONS ── */
@keyframes fadeUp {

}
@keyframes fadeDown {

/* ── RESPONSIVE ── */
